name: Render Keep-Alive 24/7

on:
  schedule:
    # Run every 14 minutes
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ClearDrop Render API Server
        run: |
          API_URL="${{ secrets.RENDER_API_URL }}"
          if [ -n "$API_URL" ]; then
            echo "Pinging $API_URL/api/health..."
            curl -s -f "$API_URL/api/health" || echo "Ping attempted."
          else
            echo "RENDER_API_URL secret not configured yet. Ping skipped."
          fi
