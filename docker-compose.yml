services:
  cleardrop-backend:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-cleardrop-dev-secret-key-32-chars}
      FRONTEND_URL: ${FRONTEND_URL:-*}
    restart: unless-stopped
